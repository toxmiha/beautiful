[workspace]
members = ["crates/beautiful-core", "crates/beautiful-app"]
resolver = "2"

[workspace.package]
version = "0.4.9"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["beautiful contributors"]

[workspace.dependencies]
beautiful-core = { path = "crates/beautiful-core" }
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    # Linux / Steam Deck (winit needs at least one); no-op on Windows.
    "x11",
    "wayland",
] }
# eframe's `wgpu` feature alone does not enable egui-wgpu/default (backends).
# Without this, Instance::new panics: no backend feature enabled.
wgpu = { version = "27", default-features = false, features = [
    "dx12",
    "vulkan",
    "wgsl",
] }
image = "0.25"
serde = { version = "1", features = ["derive"] }

# Local patches for Beautiful:
# - egui-winit: WS_EX_NOREDIRECTIONBITMAP + idle CursorMoved throttle
# - eframe: do not RepaintNext on every DeviceEvent::MouseMotion while idle
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
eframe = { path = "vendor/eframe" }

# Smaller ship binary: Rhai is gone; CPython stays a sidecar .dll / .so.
[profile.release]
strip = true

