[package]
name = "beautiful-core"
description = "Core engine for Beautiful — digital painting"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = "1"
image = { workspace = true }
rayon = "1.10"
zip = "2"
flate2 = "1"
zstd = "0.13"
blake3 = "1"
base64 = "0.22"
fontdue = "0.9"
resvg = "0.45"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
