[package]
name = "beautiful-app"
description = "Beautiful — lightweight digital painting app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "beautiful"
path = "src/main.rs"

[dependencies]
beautiful-core = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
image = { workspace = true }
rfd = "0.15"
arboard = "3"
rayon = "1.10"
serde_json = "1"
serde = { workspace = true }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
# CPython host for add-ons. Runtime is a sidecar next to the binary — never
# statically linked into the exe: Windows `python3.dll`, Linux `libpython3.12.so`.
# Pack the folder (Blender layout). tools/ensure-python-embed.ps1 (Win) /
# tools/ensure-python-linux.sh (Linux).
pyo3 = { version = "0.22", optional = true, features = ["abi3-py310"] }
zip = "2"
window-vibrancy = "0.6"
raw-window-handle = "0.6"
discord-rich-presence = "1.1"
egui-snarl = { version = "0.9.0", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
base64 = "0.23.1"
flate2 = "1.1.9"

# Windows: XInput. gilrs 0.11 defaults to WGI, which needs a focused HWND and
# often reports zero pads with eframe / custom chrome. XInput is the Xbox /
# Steam Input path and does not depend on window focus.
# Linux/BSD: evdev is always compiled (not a feature); keep default-features off
# so we don't pull Windows-only WGI.
[target.'cfg(windows)'.dependencies]
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
clipboard-win = "5"

[target.'cfg(not(windows))'.dependencies]
gilrs = { version = "0.11", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[features]
default = ["python"]
python = ["dep:pyo3"]
