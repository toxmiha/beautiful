# Build Beautiful for Linux x86_64 (Steam Deck / SteamOS compatible).
# Disabled for routine use — do not run unless explicitly needed.
name: linux-x64

on:
  # Manual only; not on push/tags (Windows is the primary ship target).
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to confirm Linux build'
        required: true
        default: ''

jobs:
  build:
    if: github.event.inputs.confirm == 'BUILD'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libssl-dev libgtk-3-dev \
            mesa-vulkan-drivers libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Bundled CPython (libpython .so sidecar)
        run: bash tools/ensure-python-linux.sh

      - name: Build release
        run: |
          export PYO3_PYTHON="$PWD/vendor/python-linux/bin/python3"
          cargo build --release -p beautiful-app

      - name: Pack folder (ELF + libpython)
        run: |
          mkdir -p dist/Beautiful-Linux
          cp target/release/beautiful dist/Beautiful-Linux/beautiful
          chmod +x dist/Beautiful-Linux/beautiful
          bash tools/ensure-python-linux.sh dist/Beautiful-Linux
          rm -f dist/beautiful-linux.7z
          ( cd dist/Beautiful-Linux && 7z a -t7z ../beautiful-linux.7z . )

      - uses: actions/upload-artifact@v4
        with:
          name: beautiful-linux-x64
          path: |
            dist/Beautiful-Linux/
            dist/beautiful-linux.7z
          if-no-files-found: error
