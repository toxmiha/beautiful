# Build Beautiful for Linux x86_64 (Steam Deck / SteamOS compatible).
# Disabled for routine use — do not run unless explicitly needed.
name: linux-x64

on:
  # Manual only; not on push/tags (Windows is the primary ship target).
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to confirm Linux build'
        required: true
        default: ''

jobs:
  build:
    if: github.event.inputs.confirm == 'BUILD'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libssl-dev libgtk-3-dev \
            mesa-vulkan-drivers libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p beautiful-app

      - name: Pack Beautiful-Alpha/linux
        run: |
          mkdir -p dist/Beautiful-Alpha/linux
          cp target/release/beautiful dist/Beautiful-Alpha/linux/
          chmod +x dist/Beautiful-Alpha/linux/beautiful
          cat > dist/Beautiful-Alpha/linux/run-beautiful.sh <<'EOF'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$DIR"
          export WGPU_BACKEND="${WGPU_BACKEND:-vulkan}"
          exec "$DIR/beautiful" "$@"
          EOF
          chmod +x dist/Beautiful-Alpha/linux/run-beautiful.sh
          cat > dist/Beautiful-Alpha/linux/README.txt <<'EOF'
          Beautiful — Linux x86_64 / Steam Deck (SteamOS)
          Run: ./run-beautiful.sh (needs Vulkan/Mesa)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: beautiful-linux-x64
          path: dist/Beautiful-Alpha/linux/
          if-no-files-found: error
